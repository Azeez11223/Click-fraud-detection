services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adshield
      POSTGRES_USER: adshield
      POSTGRES_PASSWORD: local-only
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adshield -d adshield"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      JWT_SECRET: local-development-secret-at-least-32-chars
      DATABASE_URL: postgresql://adshield:local-only@postgres:5432/adshield
      ENV: development
      CORS_ORIGINS: http://localhost:5173,http://localhost:8501
      FORWARDED_ALLOW_IPS: "127.0.0.1"
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
  ui:
    image: python:3.11-slim
    working_dir: /app
    volumes: [".:/app"]
    command: sh -c "pip install --no-cache-dir -r requirements-ui.txt && streamlit run frontend/app.py --server.address 0.0.0.0"
    environment:
      API_BASE: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]
